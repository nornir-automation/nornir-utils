[project]
name = "nornir-utils"
version = "0.3.0"
description = "Collection of plugins and functions for nornir that don't require external dependencies"
authors = [{ name = "David Barroso", email = "dbarrosop@dravetech.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # allow-prereleases carried over from Poetry: the >=3.0.0a0 floor opts nornir
    # (and only nornir) into prereleases, matching the old `allow-prereleases = true`.
    "nornir>=3.0.0a0,<4",
    "colorama>=0.4.3,<0.5",
]

[project.urls]
Repository = "https://github.com/nornir-automation/nornir-utils"

[project.entry-points."nornir.plugins.inventory"]
YAMLInventory = "nornir_utils.plugins.inventory.yaml_inventory:YAMLInventory"

[project.entry-points."nornir.plugins.transform_function"]
load_credentials = "nornir_utils.plugins.inventory.transform_functions:load_credentials"

[dependency-groups]
dev = [
    # mypy is pinned because newer versions flag pre-existing typing issues
    # in yaml_inventory.py that will be addressed separately
    "mypy==1.0.1",
    "ruff",
    "pytest",
    "nbval",
    "jupyter>=1,<2",
]
docs = [
    # sphinx <8 imports the stdlib `imghdr`, removed in Python 3.13
    "sphinx>=8.1,<9",
    "nbsphinx>=0.9.2,<0.10",
    "sphinx-issues>=5,<6",
    "sphinx-rtd-theme>=3,<4",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[tool.pytest.ini_options]
#addopts = --cov=nornir --cov-report=term-missing -vs
filterwarnings = [
    "ignore::nornir.core.exceptions.ConflictingConfigurationWarning",
]

[tool.ruff]
line-length = 100
# pylama only checked Python files, keep notebooks out of scope
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["ALL"]

ignore = [
    "COM812", # Conflicts with the formatter, ruff warns unless disabled
    "CPY001", # Missing copyright notice at top of file
    "D203",   # Incompatible with D211, ruff warns unless one is disabled
    "D213",   # Incompatible with D212, ruff warns unless one is disabled
]

[tool.ruff.lint.mccabe]
max-complexity = 10


[tool.ruff.lint.per-file-ignores]


"nornir_utils/**/*.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "A002",    # Function argument is shadowing a Python builtin
    "ANN401",  # Dynamically typed expressions (typing.Any) disallowed
    "ARG002",  # Unused method argument
    "D100",    # Missing docstring in public module
    "D101",    # Missing docstring in public class
    "D102",    # Missing docstring in public method
    "D104",    # Missing docstring in public package
    "D107",    # Missing docstring in `__init__`
    "D200",    # One-line docstring should fit on one line
    "D202",    # No blank lines allowed after function docstring
    "D205",    # 1 blank line required between summary line and description
    "D212",    # Multi-line docstring summary should start at the first line
    "D400",    # First line should end with a period
    "D401",    # First line of docstring should be in imperative mood
    "D412",    # No blank lines allowed between a section header and its content
    "D413",    # Missing blank line after last section
    "D415",    # First line should end with a period, question mark, or exclamation point
    "D417",    # Missing argument description in the docstring
    "EM101",   # Exception must not use a string literal, assign to variable first
    "FBT001",  # Boolean-typed positional argument in function definition
    "FBT002",  # Boolean default positional argument in function definition
    "I001",    # Import block is un-sorted or un-formatted
    "PLR0913", # Too many arguments in function definition
    "PLR0917", # Too many positional arguments
    "PTH110",  # `os.path.exists()` should be replaced by `Path.exists()`
    "PTH123",  # `open()` should be replaced by `Path.open()`
    "RUF022",  # `__all__` is not sorted
    "SIM108",  # Use ternary operator instead of `if`-`else`-block
    "T201",    # `print` found
    "T203",    # `pprint` found
    "TC006",   # Add quotes to type expression in `typing.cast()`
    "TRY003",  # Avoid specifying long messages outside the exception class
    "TRY004",  # Prefer `TypeError` exception for invalid type
    "UP015",   # Unnecessary mode argument
    "UP024",   # Replace aliased errors with `OSError`
    "UP032",   # Use f-string instead of `format` call
    "UP041",   # Replace aliased errors with `TimeoutError`
]


"docs/source/conf.py" = [
    ##################################################################################################
    # Review and change the below later                                                              #
    ##################################################################################################
    "A001",   # Variable is shadowing a Python builtin
    "D100",   # Missing docstring in public module
    "ERA001", # Found commented-out code
    "INP001", # File is part of an implicit namespace package, add an `__init__.py`
]


[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
