[project]
name = "nornir_utils"
version = "0.2.0"
description = "Collection of plugins and functions for nornir that don't require external dependencies"
authors = [{ name = "David Barroso", email = "dbarrosop@dravetech.com" }]
license = "Apache-2.0"
license-files = ["LICENSE"]
readme = "README.rst"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    # allow-prereleases carried over from Poetry: the >=3.0.0a0 floor opts nornir
    # (and only nornir) into prereleases, matching the old `allow-prereleases = true`.
    "nornir>=3.0.0a0,<4",
    "colorama>=0.4.3,<0.5",
]

[project.urls]
Repository = "https://github.com/nornir-automation/nornir_utils"

[project.entry-points."nornir.plugins.inventory"]
YAMLInventory = "nornir_utils.plugins.inventory.yaml_inventory:YAMLInventory"

[project.entry-points."nornir.plugins.transform_function"]
load_credentials = "nornir_utils.plugins.inventory.transform_functions:load_credentials"

[dependency-groups]
dev = [
    # mypy is pinned because newer versions flag pre-existing typing issues
    # in yaml_inventory.py that will be addressed separately
    "mypy==1.0.1",
    "ruff",
    "pytest",
    "nbval",
    "jupyter>=1,<2",
]
docs = [
    "sphinx>=5.3.0,<6",
    "sphinxcontrib-napoleon>=0.7,<0.8",
    "nbsphinx>=0.9.2,<0.10",
    "sphinx-issues>=3.0.1,<4",
    "sphinx-rtd-theme>=1.2.1,<2",
]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.uv.build-backend]
module-root = ""

[tool.mypy]
# The mypy configurations: http://bit.ly/2zEl9WI
python_version = "3.10"
check_untyped_defs = true
disallow_any_generics = true
disallow_untyped_calls = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_decorators = true
ignore_errors = false
ignore_missing_imports = true
strict_optional = true
warn_unused_configs = true
warn_unused_ignores = true
warn_return_any = true
warn_redundant_casts = true

[tool.pytest.ini_options]
#addopts = --cov=nornir --cov-report=term-missing -vs
filterwarnings = [
    "ignore::nornir.core.exceptions.ConflictingConfigurationWarning",
]

[tool.ruff]
line-length = 100
# pylama only checked Python files, keep notebooks out of scope
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Port of the previous pylama linters: pep8 (E/W) + pyflakes (F) + mccabe (C90),
# plus the pyupgrade rules that keep annotations on PEP 585/604 syntax.
select = ["E", "W", "F", "C90", "UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["uv_build>=0.11.0,<0.12.0"]
build-backend = "uv_build"
