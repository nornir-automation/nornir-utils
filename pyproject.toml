[tool.poetry]
name = "nornir_utils"
version = "0.2.0"
description = "Collection of plugins and functions for nornir that don't require external dependencies"
authors = ["David Barroso <dbarrosop@dravetech.com>"]
license = "Apache-2.0"

[tool.poetry.plugins."nornir.plugins.inventory"]
"YAMLInventory" = "nornir_utils.plugins.inventory.yaml_inventory:YAMLInventory"

[tool.poetry.plugins."nornir.plugins.transform_function"]
"load_credentials" = "nornir_utils.plugins.inventory.transform_functions:load_credentials"

[tool.poetry.dependencies]
python = ">=3.10,<4.0"
nornir = { version = "~3", allow-prereleases = true }
colorama = "^0.4.3"

[tool.poetry.dev-dependencies]
# mypy is pinned because newer versions flag pre-existing typing issues
# in yaml_inventory.py that will be addressed separately
mypy = "1.0.1"
ruff = "*"
pytest = "*"
nbval = "*"
jupyter = "^1"
sphinx = "^5.3.0"
sphinxcontrib-napoleon = "^0.7"
nbsphinx = "^0.9.2"
sphinx-issues = "^3.0.1"
sphinx_rtd_theme = "^1.2.1"

[tool.ruff]
line-length = 100
# pylama only checked Python files, keep notebooks out of scope
extend-exclude = ["*.ipynb"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
# Port of the previous pylama linters: pep8 (E/W) + pyflakes (F) + mccabe (C90)
select = ["E", "W", "F", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[build-system]
requires = ["poetry>=0.12"]
build-backend = "poetry.masonry.api"
